plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation project(":embedding")
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Boot 3.5 does not manage hibernate-vector; keep it aligned with its Hibernate core.
    implementation "org.hibernate.orm:hibernate-vector:${dependencyManagement.importedProperties['hibernate.version']}"
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation platform('software.amazon.awssdk:bom:2.25.67')
    implementation 'software.amazon.awssdk:sqs'
    implementation 'software.amazon.awssdk:apache-client'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
}

springBoot {
    mainClass = 'com.notevault.searchworker.SearchWorkerApplication'
}

tasks.bootJar {
    archiveFileName = 'search-content.jar'
}
tasks.jar { enabled = false }
