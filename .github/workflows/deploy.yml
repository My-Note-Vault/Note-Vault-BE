name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "common/**"
      - "platform-api/**"
      - "platform-service/**"
      - "workspace-api/**"
      - "workspace-service/**"
      - "knowledge-assistant-service/**"
      - "search-sync/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
      - "!**/README.md"
      - "!**/AGENTS.md"

concurrency:
  group: production-api-deploy
  cancel-in-progress: false

env:
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build:
    name: API Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: never

      - name: Build (bootJar)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :bootJar --build-cache --parallel

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/note-vault:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/note-vault:latest
          cache-from: type=gha,scope=note-vault-api,version=2
          cache-to: type=gha,scope=note-vault-api,version=2,mode=min

  deploy:
    name: API Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Web EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.WEB_HOST }}
          username: ec2-user
          key: ${{ secrets.WEB_SSH_KEY }}
          script: |
            set -euo pipefail
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            export IMAGE_NAME="note-vault"
            bash /home/ec2-user/deploy/deploy-was.sh "${{ github.sha }}"
