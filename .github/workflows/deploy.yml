name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "common/**"
      - "platform-api/**"
      - "platform-service/**"
      - "workspace-api/**"
      - "workspace-service/**"
      - "knowledge-assistant-service/**"
      - "search-sync/**"
      - "search-content/**"
      - "embedding/**"
      - ".github/workflows/deploy-worker.yml"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"

concurrency:
  group: production-api-deploy
  cancel-in-progress: false

jobs:
  deploy-worker:
    uses: ./.github/workflows/deploy-worker.yml
    secrets: inherit

  build-and-deploy:
    needs: deploy-worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build (bootJar)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :bootJar

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/note-vault"
          TAG="${{ github.sha }}"

          docker build --no-cache -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

      - name: Deploy via Web EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.WEB_HOST }}
          username: ec2-user
          key: ${{ secrets.WEB_SSH_KEY }}
          script: |
            set -euo pipefail
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            export IMAGE_NAME="note-vault"
            bash /home/ec2-user/deploy/deploy-was.sh "${{ github.sha }}"
