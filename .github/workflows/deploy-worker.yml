name: Deploy Worker

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: production-worker-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      TAG: ${{ github.sha }}
      WORKER_PRIVATE_IP: ${{ secrets.WORKER_PRIVATE_IP }}
      WORKER_SSH_KEY_PATH: ${{ vars.WORKER_SSH_KEY_PATH }}

    steps:
      - name: Check Worker host
        shell: bash
        run: |
          set -euo pipefail
          : "${WORKER_PRIVATE_IP:?Set the WORKER_PRIVATE_IP repository secret}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node for the embedded Yjs bundle
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: search-content/crdt-js/package-lock.json

      - name: Build embedded Yjs runtime
        working-directory: search-content/crdt-js
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          git diff --exit-code -- ../src/main/resources/crdt/

      - name: Build Worker
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :search-content:bootJar

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Worker image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${DOCKERHUB_USERNAME}/note-vault-worker"
          docker build --no-cache -f search-content/Dockerfile \
            -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

      - name: Deploy Worker via WEB
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.WEB_HOST }}
          username: ec2-user
          key: ${{ secrets.WEB_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,TAG,WORKER_PRIVATE_IP,WORKER_SSH_KEY_PATH
          command_timeout: 15m
          script: |
            set -euo pipefail
            bash /home/ec2-user/deploy/deploy-worker.sh "$TAG"
