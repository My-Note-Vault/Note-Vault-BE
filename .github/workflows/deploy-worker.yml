name: Deploy Worker

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "search-content/**"
      - "embedding/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".dockerignore"
      - ".github/workflows/deploy-worker.yml"
      - "!**/README.md"
      - "!**/AGENTS.md"

concurrency:
  group: production-worker-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      TAG: ${{ github.sha }}
      WORKER_PRIVATE_IP: ${{ secrets.WORKER_PRIVATE_IP }}
      WORKER_SSH_KEY_PATH: ${{ vars.WORKER_SSH_KEY_PATH }}

    steps:
      - name: Check Worker host
        shell: bash
        run: |
          set -euo pipefail
          : "${WORKER_PRIVATE_IP:?Set the WORKER_PRIVATE_IP repository secret}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node for the embedded Yjs bundle
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: search-content/crdt-js/package-lock.json

      - name: Build embedded Yjs runtime
        working-directory: search-content/crdt-js
        run: |
          npm ci --prefer-offline --ignore-scripts --no-audit --no-fund
          npm run build
          git diff --exit-code -- ../src/main/resources/crdt/

      - name: Build Worker
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :search-content:bootJar --build-cache --parallel

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: search-content/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/note-vault-worker:${{ env.TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/note-vault-worker:latest
          cache-from: type=gha,scope=note-vault-worker,version=2
          cache-to: type=gha,scope=note-vault-worker,version=2,mode=min

      - name: Deploy Worker via WEB
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.WEB_HOST }}
          username: ec2-user
          key: ${{ secrets.WEB_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,TAG,WORKER_PRIVATE_IP,WORKER_SSH_KEY_PATH
          command_timeout: 15m
          script: |
            set -euo pipefail
            bash /home/ec2-user/deploy/deploy-worker.sh "$TAG"
